
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Symmetry target glyphs</title>
<style>
@font-face {
  font-family: "JSesh";
  src: url("../fonts/JSeshFont.ttf");
}
body {
  font-family: Arial, sans-serif;
  background:#f5f5f5;
  margin:40px;
}
.grid {
  display:grid;
  grid-template-columns: repeat(2, 320px);
  gap:24px;
}
.card {
  background:white;
  border:1px solid #ddd;
  border-radius:12px;
  padding:20px;
}
.glyph {
  font-family: "JSesh";
  font-size:180px;
  line-height:1;
  text-align:center;
}
.meta {
  text-align:center;
  margin-top:10px;
}
</style>
</head>
<body>
<h1>Representative glyphs used in symmetry spectrum validation</h1>
<div class="grid">

    <div class="card">
      <div class="glyph">𓎧</div>
      <div class="meta">
        <b>V35</b><br>
        U+133A7
      </div>
    </div>
    
    <div class="card">
      <div class="glyph">𓎗</div>
      <div class="meta">
        <b>V24</b><br>
        U+13397
      </div>
    </div>
    
    <div class="card">
      <div class="glyph">𓈙</div>
      <div class="meta">
        <b>N37</b><br>
        U+13219
      </div>
    </div>
    
    <div class="card">
      <div class="glyph">𓉧</div>
      <div class="meta">
        <b>O13</b><br>
        U+13267
      </div>
    </div>
    
    <div class="card">
      <div class="glyph">𓁲</div>
      <div class="meta">
        <b>C33</b><br>
        U+13072
      </div>
    </div>
    
</div>
</body>
</html>

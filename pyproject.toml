[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ancientscriptlab"
version = "0.1.0"
description = "Scientific framework for objective analysis of symbolic systems."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "PyYAML>=6.0"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "tools*"]
